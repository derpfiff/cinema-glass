<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Cinema Glass – Kino-Oberfläche für Jellyfin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060a"/><stop offset="1" stop-color="#0b0d16"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d6ff"/></linearGradient>
    <clipPath id="r"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="1010" cy="110" r="190" fill="#7a5cff" opacity=".75"/>
      <circle cx="1180" cy="330" r="170" fill="#ff5c8a" opacity=".6"/>
      <circle cx="800" cy="380" r="150" fill="#22c1ff" opacity=".5"/>
      <circle cx="180" cy="60" r="140" fill="#2b6bff" opacity=".35"/>
    </g>
    <!-- angedeutete Oberfläche: Glasfenster mit Karten -->
    <g transform="translate(760 70) rotate(-6 220 150)">
      <rect width="460" height="290" rx="26" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
      <rect x="150" y="18" width="160" height="26" rx="13" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".25"/>
      <rect x="154" y="22" width="52" height="18" rx="9" fill="#fff" fill-opacity=".35"/>
      <rect x="28" y="96" width="170" height="16" rx="8" fill="#fff" fill-opacity=".85"/>
      <rect x="28" y="122" width="230" height="8" rx="4" fill="#fff" fill-opacity=".35"/>
      <rect x="28" y="138" width="190" height="8" rx="4" fill="#fff" fill-opacity=".25"/>
      <rect x="28" y="164" width="104" height="34" rx="17" fill="#fff"/>
      <path d="M62 174 l0 14 l12 -7z" fill="#0b0d16"/>
      <rect x="82" y="178" width="36" height="6" rx="3" fill="#0b0d16" fill-opacity=".8"/>
      <circle cx="158" cy="181" r="17" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".3"/>
      <circle cx="200" cy="181" r="17" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".3"/>
      <g fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".22">
        <rect x="28" y="222" width="92" height="52" rx="10"/><rect x="130" y="222" width="92" height="52" rx="10"/><rect x="232" y="222" width="92" height="52" rx="10"/><rect x="334" y="222" width="92" height="52" rx="10"/>
      </g>
    </g>
  </g>
  <!-- Schrift außerhalb der Maske und ohne Verlauf: so zeichnen Browser sie gestochen scharf -->
    <g text-rendering="geometricPrecision" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="188" font-size="84" font-weight="700" fill="#ffffff">Cinema Glass</text>
    <text x="84" y="238" font-size="27" font-weight="400" fill="#fff" fill-opacity=".72">Kino-Oberfläche für Jellyfin · ein Plugin</text>
    <g font-size="17" font-weight="500" fill="#fff" fill-opacity=".9">
      <g transform="translate(84 286)"><rect width="136" height="38" rx="19" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".28"/><text x="68" y="25" text-anchor="middle">Hero-Banner</text></g>
      <g transform="translate(232 286)"><rect width="130" height="38" rx="19" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".28"/><text x="65" y="25" text-anchor="middle">Folgenregal</text></g>
      <g transform="translate(374 286)"><rect width="122" height="38" rx="19" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".28"/><text x="61" y="25" text-anchor="middle">Downloads</text></g>
      <g transform="translate(508 286)"><rect width="84" height="38" rx="19" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".28"/><text x="42" y="25" text-anchor="middle">Seerr</text></g>
      <g transform="translate(604 286)"><rect width="140" height="38" rx="19" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".28"/><text x="70" y="25" text-anchor="middle">Bewertungen</text></g>
    </g>
  </g>
</svg>
